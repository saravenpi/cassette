[package]
name = "cassette"
version = "0.17.2"
edition = "2024"
description = "A session DAW with a Rust audio engine and a SvelteKit frontend"
license = "MIT"

[lib]
name = "cassette"
path = "src/lib.rs"

[features]
default = []
# Real-time audio through cpal (ALSA/PipeWire/CoreAudio/WASAPI).
# Requires the platform audio development headers, e.g. on Debian/Ubuntu:
#   sudo apt install libasound2-dev
cpal = ["dep:cpal"]

[dependencies]
anyhow = "1.0"
crossbeam = "0.8"
rtrb = "0.3"
assert_no_alloc = "1.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = { version = "0.15", optional = true }
symphonia = { version = "=0.5.4", features = ["all"] }

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
